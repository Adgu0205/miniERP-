{% load humanize %}
<div class="card p-4 reveal relative overflow-hidden group">
  <div class="absolute -right-4 -top-4 h-16 w-16 rounded-full bg-{{ color }}-500/10 group-hover:scale-150 transition-transform"></div>
  <div class="text-xs text-slate-500">{{ label }}</div>
  <div class="text-2xl font-bold mt-1 text-{{ color }}-700 dark:text-{{ color }}-300" data-countup
       data-value="{{ value|stringformat:'f' }}" data-prefix="{{ prefix }}" data-suffix="{{ suffix }}">{{ prefix }}{{ value|floatformat:0|intcomma }}{{ suffix }}</div>
  {% if delta != "" %}
  <div class="text-xs mt-1 flex items-center gap-1 {% if delta >= 0 %}text-slate-500{% else %}text-rose-500{% endif %}">
    {% if delta >= 0 %}▲{% else %}▼{% endif %} {{ delta|floatformat:1 }}%
    <span class="text-slate-400">vs prev</span>
  </div>
  {% endif %}
</div>
