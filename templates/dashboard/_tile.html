{% load humanize %}
<a href="{{ url|default:'#' }}"
   class="card p-4 reveal relative overflow-hidden group block hover:-translate-y-0.5 hover:shadow-md transition-all">
  <div class="absolute -right-4 -top-4 h-16 w-16 rounded-full bg-{{ color }}-500/10 group-hover:scale-150 transition-transform"></div>
  <div class="flex items-center justify-between">
    <div class="text-xs text-slate-500">{{ label }}</div>
    <svg class="h-3.5 w-3.5 text-slate-300 opacity-0 group-hover:opacity-100 transition" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M9 5l7 7-7 7"/></svg>
  </div>
  <div class="text-2xl font-bold mt-1 text-{{ color }}-700 dark:text-{{ color }}-300" data-countup
       data-value="{{ value|stringformat:'f' }}" data-prefix="{{ prefix }}" data-suffix="{{ suffix }}">{{ prefix }}{{ value|floatformat:0|intcomma }}{{ suffix }}</div>
  {% if delta != "" %}
  <div class="text-xs mt-1 flex items-center gap-1 {% if delta >= 0 %}text-teal-600{% else %}text-rose-500{% endif %}">
    {% if delta >= 0 %}▲{% else %}▼{% endif %} {{ delta|floatformat:1 }}% <span class="text-slate-400">vs prev 30d</span>
  </div>
  {% else %}
  <div class="text-xs mt-1 text-slate-400">live snapshot</div>
  {% endif %}
</a>
