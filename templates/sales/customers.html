{% extends "base.html" %}
{% block breadcrumb %}Sales / Customers{% endblock %}
{% block content %}
<div class="flex items-center justify-between mb-4">
  <h1 class="text-xl font-semibold">Customers</h1>
  <a href="{% url 'sales:customer_new' %}" class="rounded-md bg-violet-600 text-white text-sm px-4 py-2">+ New</a>
</div>
<div class="card overflow-x-auto"><table class="erp">
  <thead><tr><th>Name</th><th>Email</th><th>Phone</th><th>Address</th></tr></thead>
  <tbody>{% for c in customers %}<tr>
    <td><a href="{% url 'sales:customer_edit' c.pk %}" class="text-violet-600 hover:underline">{{ c.name }}</a></td>
    <td class="text-slate-500">{{ c.email }}</td><td>{{ c.phone }}</td><td class="text-slate-500">{{ c.address }}</td>
  </tr>{% empty %}<tr><td colspan="4" class="text-center text-slate-500 py-8">No customers.</td></tr>{% endfor %}</tbody>
</table></div>
{% endblock %}
